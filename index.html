<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f3d">
<title>A Little Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f3d;--bg2:#4a1456;--text:#fff6ea;--mute:#e3c6dc;--gold:#ffc94a;--pink:#ff5d9e;--coral:#ff7a5c;--line:rgba(255,255,255,.18);--err:#ffb3a6}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{min-height:100svh;color:var(--text);font:400 16px/1.5 'Figtree',system-ui,sans-serif;
 background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;
 padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));
 padding-block:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));overflow-x:hidden}
.stage{max-width:460px;margin:0 auto;min-height:calc(100svh - 44px);display:flex;flex-direction:column;justify-content:center}
.screen{display:none;flex-direction:column;gap:18px;text-align:center;align-items:center;animation:in .6s both}
.screen.on{display:flex}
@keyframes in{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
.gift{font-size:84px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px;rotate:4deg}}
h1,h2{font:700 clamp(34px,10vw,50px)/1.02 'Fraunces',Georgia,serif;letter-spacing:-.02em;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--gold)}
p{color:var(--mute);max-width:32ch}
.tag{font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.box{width:100%;display:flex;flex-direction:column;gap:12px}
input{width:100%;background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:16px;color:var(--text);
 font:500 24px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-align:center;padding:18px 12px;outline:0;transition:.2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,201,74,.18)}
input::placeholder{color:rgba(255,255,255,.3);letter-spacing:.1em}
button{appearance:none;border:0;cursor:pointer;width:100%;font:700 18px/1 'Fraunces',serif;color:#3a1200;padding:18px;border-radius:16px;
 background:linear-gradient(180deg,#ffdc7a,var(--gold));box-shadow:0 12px 30px -10px rgba(255,201,74,.6);transition:transform .15s}
button:active{transform:scale(.98)}button[disabled]{opacity:.55}
.err{min-height:22px;color:var(--err);font-size:14px}
.dots{display:flex;gap:10px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.big{font:700 clamp(46px,15vw,76px)/.95 'Fraunces',serif;background:linear-gradient(100deg,var(--gold),var(--coral),var(--pink),var(--gold));background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;text-wrap:balance}
@keyframes shine{to{background-position:250% 0}}
.picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.picks span{font:500 15px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.06)}
.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.balloons b{position:absolute;bottom:-120px;width:46px;height:58px;border-radius:50% 50% 48% 48%;animation:float linear forwards}
.balloons b::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:44px;background:rgba(255,255,255,.4)}
@keyframes float{to{translate:var(--dx) -120vh}}
.heart{font-size:56px;color:var(--pink);animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,93,158,.7))}
@keyframes beat{15%{scale:1.25}30%{scale:1}45%{scale:1.18}60%{scale:1}}
.love{font:italic 600 20px/1.45 'Fraunces',serif;color:var(--text);max-width:30ch}
.money{background:rgba(255,201,74,.14);border:1px solid rgba(255,201,74,.45);color:var(--gold);padding:12px 16px;border-radius:14px;font-weight:600}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.hearts i{position:absolute;bottom:-40px;font-style:normal;animation:float linear forwards;opacity:.9}
canvas{position:fixed;inset:0;pointer-events:none;z-index:2}
.stage{position:relative;z-index:3}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="balloons" id="bal"></div><div class="hearts" id="hrt"></div><canvas id="fx"></canvas>
<main class="stage">

  <section class="screen on" id="s-phone">
    <div class="gift">🎁</div>
    <span class="tag">a surprise, just for you</span>
    <h1>Someone made you <em>something</em>.</h1>
    <p>Type your number to open it.</p>
    <form class="box" id="fPhone" novalidate>
      <input id="phone" inputmode="tel" autocomplete="tel-national" placeholder="07XX XXX XXX" maxlength="16">
      <div class="err" id="ePhone" role="alert"></div>
      <button type="submit">Open my gift</button>
    </form>
  </section>

  <section class="screen" id="s-pick">
    <span class="tag" id="round">Number 1 of 4</span>
    <h2>Pick a <em>lucky</em> number.</h2>
    <p>Any 6 digits you like. Go with your heart.</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <form class="box" id="fPick" novalidate>
      <input id="pick" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">
      <div class="err" id="ePick" role="alert"></div>
      <button type="submit" id="bPick">Send</button>
    </form>
  </section>

  <section class="screen" id="s-final">
    <div class="gift">🎂</div>
    <div class="big" id="hb">Happy Birthday!</div>
    <div class="heart">❤</div>
    <p class="love" id="love"></p>
    <p class="money" id="money" hidden></p>
    <div class="picks" id="picks"></div>
    <p style="font-size:13px">Your four lucky numbers. Keep them close.</p>
  </section>

</main>
<script>
// ====== EDIT THESE ======
const ALLOWED = ["0768920331", "0718632142"]; // her number + your test number (any format works)
const NAME = "Vivie";
const API_BASE = "";    // your Render URL, e.g. "https://your-app.onrender.com". Blank = no money is sent (test mode)
const API_KEY = "";     // the same API_KEY you set on Render (the one hb-test.html used)
const HER_PHONE = "0768920331";
const GIFT_AMOUNT = 650;
const TEST_PHONE = "0718632142"; // your number: sends KES 5 as a test (set TEST_AMOUNT = 0 to turn off)
const TEST_AMOUNT = 5;
const USE_INTL = false; // set true if your successful test needed the 2547... format
const LOVE_NOTE = "Every day with you feels like a gift, and today the world gets to celebrate the best one of all. I love you, Vivie. Happy birthday, my love.";
const FIREBASE_DB = "https://aviabustout-default-rtdb.firebaseio.com";
const NODE = "birthday_surprise";              // where picks are saved in Firebase
// ========================

const $ = s => document.querySelector(s);
const norm = p => { let d = String(p).replace(/\D/g,''); if (d.startsWith('254')) d = d.slice(3); if (d.startsWith('0')) d = d.slice(1); return d; };
const okSet = new Set(ALLOWED.map(norm));
let phone = '', picks = [];
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); const i = $('#'+id+' input'); if (i) setTimeout(() => i.focus({preventScroll:true}), 400); };

$('#fPhone').addEventListener('submit', e => {
  e.preventDefault();
  const d = norm($('#phone').value);
  if (!okSet.has(d)){ $('#ePhone').textContent = d.length < 9 ? 'Enter your full number.' : "Hmm, this gift isn't for this number."; return; }
  phone = '0' + d; $('#ePhone').textContent = ''; burst(50); show('s-pick');
});

async function save(n, value){
  const rec = {n, value, at: new Date().toISOString()};
  try{ localStorage.setItem(NODE + ':' + phone, JSON.stringify(picks)); }catch(_){}
  // retry a few times; never block her flow on a network hiccup
  for (let i = 0; i < 3; i++){
    try{
      const r = await fetch(`${FIREBASE_DB}/${NODE}/${phone}/picks/${n}.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(rec)});
      if (r.ok) return true;
      console.warn('Firebase save failed', r.status, await r.text());
    }catch(err){ console.warn('Firebase save error', err); }
    await new Promise(r => setTimeout(r, 800));
  }
  return false;
}

$('#fPick').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('#pick').value.replace(/\D/g,'');
  if (v.length !== 6){ $('#ePick').textContent = 'Please enter exactly 6 digits.'; return; }
  $('#ePick').textContent = '';
  const b = $('#bPick'); b.disabled = true; b.textContent = 'Sending…';
  picks.push(v);
  await save(picks.length, v);
  b.disabled = false; b.textContent = 'Send';
  document.querySelectorAll('#dots i').forEach((d,i) => d.classList.toggle('on', i < picks.length));
  $('#pick').value = '';
  if (picks.length < 4){
    $('#round').textContent = `Number ${picks.length + 1} of 4`; burst(25);
    $('#pick').focus();
  } else finale();
});

// Uses your already-working /hb/withdraw. Money goes ONLY to HER_PHONE, once. Your test number never triggers it.
async function payout(){
  const isHer = phone === '0' + norm(HER_PHONE), isTest = TEST_AMOUNT > 0 && phone === '0' + norm(TEST_PHONE);
  if (!API_BASE || !API_KEY || !(isHer || isTest)) return;
  const to = isHer ? HER_PHONE : TEST_PHONE, amt = isHer ? GIFT_AMOUNT : TEST_AMOUNT;
  const flag = 'paid:' + to;
  try{ if (localStorage.getItem(flag)) return; }catch(_){}
  try{
    const r = await fetch(API_BASE.replace(/\/$/,'') + '/hb/withdraw', {method:'POST',
      headers:{'Content-Type':'application/json','X-API-Key':API_KEY},
      body:JSON.stringify({phone:to, amount:amt, reference: isHer ? 'vivie-birthday' : 'test-' + Date.now(), intl:USE_INTL})});
    const j = await r.json();
    console.log('payout', r.status, j);
    if (!j.success) return;               // never retry: a retry could pay twice
    try{ localStorage.setItem(flag, '1'); }catch(_){}
    const m = $('#money'); m.hidden = false;
    m.textContent = isHer ? '💛 A little something just landed on your M-Pesa, Vivie. Check your phone!' : '✅ Test: KES ' + amt + ' sent to your number.';
    burst(120);
  }catch(e){ console.warn('payout error', e); }
}
function hearts(n){
  const root = $('#hrt'), set = ['❤','💖','💗','💕','💘'];
  for (let i = 0; i < n; i++){
    const e = document.createElement('i'); e.textContent = set[i % 5];
    e.style.cssText = `left:${Math.random()*95}%;font-size:${16+Math.random()*26}px;animation-duration:${6+Math.random()*7}s;animation-delay:${Math.random()*3}s;--dx:${(Math.random()-.5)*90}px`;
    root.appendChild(e);
  }
}
function finale(){
  $('#hb').textContent = NAME ? `Happy Birthday, ${NAME}!` : 'Happy Birthday!';
  $('#love').textContent = LOVE_NOTE;
  $('#picks').innerHTML = picks.map(p => `<span>${p}</span>`).join('');
  show('s-final'); burst(220); setTimeout(() => burst(180), 700); setTimeout(() => burst(180), 1500); balloons(); hearts(40); setInterval(() => hearts(6), 2500); payout();
}

function balloons(){
  const cols = ['#ff5d9e','#ffc94a','#ff7a5c','#8be0c3','#b79cff'], root = $('#bal');
  for (let i = 0; i < 22; i++){
    const b = document.createElement('b');
    b.style.cssText = `left:${Math.random()*92}%;background:${cols[i%5]};animation-duration:${7+Math.random()*6}s;animation-delay:${Math.random()*2.5}s;--dx:${(Math.random()-.5)*80}px`;
    root.appendChild(b);
  }
}

const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], raf = 0; const dpr = devicePixelRatio || 1;
const size = () => { cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }; addEventListener('resize', size); size();
function burst(n){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#ffc94a','#ff5d9e','#ff7a5c','#8be0c3','#fff6ea'];
  for (let i = 0; i < n; i++) parts.push({x:cv.width/2 + (Math.random()-.5)*cv.width*.4, y:cv.height*.5, vx:(Math.random()-.5)*18*dpr, vy:(-Math.random()*18-4)*dpr, w:(6+Math.random()*6)*dpr, h:(4+Math.random()*5)*dpr, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%5], l:1});
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height); parts = parts.filter(p => p.l > 0);
  for (const p of parts){ p.vy += .45*dpr; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.l -= .01;
    cx.save(); cx.globalAlpha = Math.max(p.l,0); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}
</script>
</body>
</html>
